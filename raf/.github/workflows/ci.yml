name: checks

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
# revisit the naming
      - uses: actions/setup-python@v5
        with:
          python-version: ["3.10", "3.11", "3.12"]
      - name: tests
        run: python -m unittest discover -s tests -t .
