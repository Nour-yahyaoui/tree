[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raf"
version = "1.0.0"
description = "A read-later shelf you host yourself: sqlite, a CLI, no dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nour Yahyaoui" }]
keywords = ["read-later", "bookmarks", "sqlite", "cli"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
raf = "raf.cli:main"

[tool.setuptools]
packages = ["raf"]
